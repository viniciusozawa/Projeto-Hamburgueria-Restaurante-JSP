<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área do Gerente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-destaque: #f39c12;
            --cor-dark: #1a1a2e;
            --cor-card: rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cor-dark);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1481833761820-0509d3217039?w=1920&q=80') center/cover no-repeat;
            opacity: 0.15;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-brand .brand-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--cor-destaque), #e67e22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 8px 25px rgba(243,156,18,0.4);
        }

        .login-brand h4 {
            color: #fff;
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 0.25rem;
        }

        .login-brand p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        .form-label {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-right: none;
            color: rgba(255,255,255,0.5);
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-left: none;
            color: #fff;
            padding: 0.65rem 1rem;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: var(--cor-destaque);
            box-shadow: 0 0 0 3px rgba(243,156,18,0.15);
            color: #fff;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.3); }

        .toggle-senha {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-left: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s;
            padding: 0 0.75rem;
        }

        .toggle-senha:hover { color: var(--cor-destaque); }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, var(--cor-destaque), #e67e22);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(243,156,18,0.3);
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243,156,18,0.45);
        }

        .btn-login:active { transform: translateY(0); }

        .alert-erro {
            background: rgba(231,76,60,0.15);
            border: 1px solid rgba(231,76,60,0.3);
            color: #e74c3c;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .divider {
            text-align: center;
            position: relative;
            margin: 1.5rem 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .divider span {
            background: rgba(26, 26, 46, 0.8);
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            padding: 0 1rem;
            position: relative;
        }

        .btn-voltar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.65rem;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-voltar:hover {
            border-color: rgba(255,255,255,0.3);
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .credencial-hint {
            text-align: center;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: rgba(243,156,18,0.08);
            border: 1px solid rgba(243,156,18,0.2);
            border-radius: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 0.78rem;
        }

        .credencial-hint span { color: var(--cor-destaque); font-weight: 500; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Brand -->
            <div class="login-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-burger"></i>
                </div>
                <h4>Área do Gerente</h4>
                <p>Faça login para acessar o painel</p>
            </div>

            <!-- Alerta de erro (aparece quando erro=1 na URL) -->
            <div class="alert-erro" id="alertErro" style="display:none">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Usuário ou senha incorretos. Tente novamente.</span>
            </div>

            <!-- Formulário -->
            <form method="post" action="com/mycompany/restaurantehamburgueria/controller/LoginController">
                <div class="mb-3">
                    <label class="form-label">Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-user fa-sm"></i>
                        </span>
                        <input type="text" class="form-control" name="usuario"
                               placeholder="Digite seu usuário" required autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock fa-sm"></i>
                        </span>
                        <input type="password" class="form-control" name="senha" id="senhaInput"
                               placeholder="Digite sua senha" required autocomplete="current-password">
                        <button type="button" class="toggle-senha" onclick="toggleSenha()">
                            <i class="fa-solid fa-eye fa-sm" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
                </button>
            </form>

            <div class="divider"><span>ou</span></div>

            <a href="index.jsp" class="btn-voltar">
                <i class="fa-solid fa-arrow-left fa-sm"></i>
                Voltar ao site
            </a>

            <!-- Dica de credenciais para desenvolvimento -->
            <div class="credencial-hint">
                <i class="fa-solid fa-circle-info me-1"></i>
                Usuário: <span>admin</span> &nbsp;|&nbsp; Senha: <span>admin123</span>
            </div>
        </div>
    </div>

    <script>
        // Mostrar alerta de erro se URL tiver erro=1
        const params = new URLSearchParams(window.location.search);
        if (params.get('erro') === '1') {
            document.getElementById('alertErro').style.display = 'flex';
        }

        // Toggle visibilidade da senha
        function toggleSenha() {
            const input = document.getElementById('senhaInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash fa-sm';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye fa-sm';
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
